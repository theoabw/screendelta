name: check

# The repository's own gate, on every push and every pull request.
#
# `make check-strict` runs the test suite, the traceability check and the report check, so a change that leaves a
# requirement untraced, a figure in the report that the repository does not support, or a failing test cannot pass
# quietly. `make cross` builds the three targets the portability requirement names.
#
# The mutation and regression checks are deliberately not here: both mutate the working tree to see whether the
# tests notice, which is a thing to do on a machine with nothing else on it, and the report says so.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The checks read the history: the commit count, the trailer counts and the days of work all come from
          # git log, and the default shallow clone shows a single commit, so the gate failed on the runner while
          # passing locally. The first run of this workflow is what found that, which is the reason to have it.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - name: Install the tools the checks call
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3
      - name: The gate
        run: make check-strict
      - name: Build the three targets
        run: make cross
