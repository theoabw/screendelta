stages:
  - verify
  - test

spec-traceability:
  stage: verify
  image: python:3.12-slim
  script:
    # --require-specs is on because specs/001-frame-delta-engine/spec.md now exists,
    # so a repository whose specification disappeared must fail rather than pass
    # quietly. `make check-strict` runs the same command locally.
    - python3 scripts/check_traceability.py --require-specs
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# The Go jobs run against ./... rather than a named package, so that they are green
# on an empty tree and become meaningful the moment code lands. The language level
# in go.mod is 1.24, and this image pins that level deliberately: a build that only
# works on a newer toolchain than the module claims is a defect.

go-test:
  stage: test
  image: golang:1.24
  script:
    - go build ./...
    - go vet ./...
    - go test ./...
    - go test -coverprofile=coverage.txt ./internal/...
    - go tool cover -func=coverage.txt | tail -1
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# NFR-008 requires the engine to run on Linux and Windows, and the target users are
# on Windows desktops, so the cross-build is a gate rather than a release step. linux/arm64 is built as well,
# because a portability claim that covers one architecture is a claim about that architecture.
go-cross-build:
  stage: test
  image: golang:1.24
  script:
    # The same command a developer runs, so the three targets CI claims to check are the three the Makefile
    # builds, and the list cannot drift between the two.
    - make cross
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
