stages:
  - verify

spec-traceability:
  stage: verify
  image: python:3.12-slim
  script:
    # While specs/ is empty this succeeds with a warning, so the pipeline is green
    # on an unstarted repository. Once specs/001-<slug>/spec.md exists, add
    # --require-specs to the line below, so that a repository whose specification
    # disappeared fails instead of passing quietly.
    - python3 scripts/check_traceability.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# The test job is added once the technology stack is selected, so that this file
# never reports a green pipeline for a suite that does not exist yet.
