stages:
  - verify

spec-traceability:
  stage: verify
  image: python:3.12-slim
  script:
    # --require-specs is on because specs/001-frame-delta-engine/spec.md now exists,
    # so a repository whose specification disappeared must fail rather than pass
    # quietly. `make check-strict` runs the same command locally.
    - python3 scripts/check_traceability.py --require-specs
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# The test job is added once the technology stack is selected, so that this file
# never reports a green pipeline for a suite that does not exist yet.
